<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Median time to first token by concurrency</title>
  <desc id="desc">Grouped bar chart comparing CPU and NVIDIA L4 GPU median time to first token at concurrency 1, 2, 4, and 8. GPU time to first token is lower at every tested concurrency.</desc>
  <rect width="720" height="480" rx="18" fill="#ffffff"/>
  <text x="40" y="42" fill="#0f172a" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Median time to first token</text>
  <text x="40" y="69" fill="#475569" font-family="system-ui, sans-serif" font-size="13">TTFT in milliseconds · lower is better</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="70" y1="100" x2="690" y2="100"/>
    <line x1="70" y1="167.5" x2="690" y2="167.5"/>
    <line x1="70" y1="235" x2="690" y2="235"/>
    <line x1="70" y1="302.5" x2="690" y2="302.5"/>
    <line x1="70" y1="370" x2="690" y2="370"/>
  </g>
  <g fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">
    <text x="60" y="104">320</text>
    <text x="60" y="171.5">240</text>
    <text x="60" y="239">160</text>
    <text x="60" y="306.5">80</text>
    <text x="60" y="374">0</text>
  </g>

  <g fill="#64748b">
    <rect x="110" y="352.1" width="34" height="17.9" rx="4"/>
    <rect x="265" y="339.4" width="34" height="30.6" rx="4"/>
    <rect x="420" y="271.0" width="34" height="99.0" rx="4"/>
    <rect x="575" y="122.4" width="34" height="247.6" rx="4"/>
  </g>
  <g fill="#2563eb">
    <rect x="152" y="365.4" width="34" height="4.6" rx="2"/>
    <rect x="307" y="364.3" width="34" height="5.7" rx="2"/>
    <rect x="462" y="360.6" width="34" height="9.4" rx="3"/>
    <rect x="617" y="355.7" width="34" height="14.3" rx="4"/>
  </g>

  <g fill="#334155" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    <text x="127" y="345">21.2</text>
    <text x="282" y="332">36.3</text>
    <text x="437" y="264">117.3</text>
    <text x="592" y="115">293.5</text>
    <text x="169" y="350">5.5</text>
    <text x="324" y="350">6.7</text>
    <text x="479" y="347">11.1</text>
    <text x="634" y="343">16.9</text>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="148" y="398">c=1</text>
    <text x="303" y="398">c=2</text>
    <text x="458" y="398">c=4</text>
    <text x="613" y="398">c=8</text>
  </g>
  <text x="380" y="428" fill="#475569" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Concurrent requests</text>

  <rect x="226" y="445" width="13" height="13" rx="3" fill="#64748b"/>
  <text x="246" y="456" fill="#334155" font-family="system-ui, sans-serif" font-size="12">CPU (-ngl 0)</text>
  <rect x="372" y="445" width="13" height="13" rx="3" fill="#2563eb"/>
  <text x="392" y="456" fill="#334155" font-family="system-ui, sans-serif" font-size="12">NVIDIA L4</text>
</svg>
