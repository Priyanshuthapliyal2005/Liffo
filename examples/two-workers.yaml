listen: 127.0.0.1:8088
mode: static
route_method: least_inflight
max_inflight: 4
max_admit_waiters: 64
admit_timeout_ms: 3000
retry_enabled: true
model: local
timeout_sec: 120
workers:
  - label: worker-a
    url: http://127.0.0.1:8080
    capacity: 1
  - label: worker-b
    url: http://127.0.0.1:8081
    capacity: 1
lifecycle:
  enabled: false
